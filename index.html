<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USHA.AI | Submission & Admission</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-card">

            <!-- USHA.AI BRANDING -->
            <div class="header">

                <div class="logo">
                    USHA<span>.AI</span>
                </div>

                <h1>Submission & Admission</h1>

                <p>
                    Welcome to USHA.AI
                </p>

            </div>


            <!-- COMING SOON -->
            <div class="coming-soon-section">

                <div class="coming-card">
                    <div class="coming-icon">🤖</div>

                    <h2>AI Submission</h2>

                    <span>COMING SOON</span>

                    <p>
                        AI-powered submission system is coming soon.
                    </p>
                </div>


                <div class="coming-card">
                    <div class="coming-icon">🎓</div>

                    <h2>Admission</h2>

                    <span>COMING SOON</span>

                    <p>
                        USHA.AI admission system is coming soon.
                    </p>
                </div>

            </div>


            <!-- LOGO NAME -->
            <div class="brand-name">

                <p>Logo Name</p>

                <strong>USHA.AI</strong>

            </div>


            <!-- SUBMISSION FORM -->
            <form
                action="https://formsubmit.co/iamsnkbd@protonmail.com"
                method="POST"
                enctype="multipart/form-data"
            >

                <!-- EMAIL SUBJECT -->
                <input
                    type="hidden"
                    name="_subject"
                    value="New USHA.AI Submission"
                >

                <!-- CAPTCHA -->
                <input
                    type="hidden"
                    name="_captcha"
                    value="false"
                >

                <!-- SUCCESS PAGE -->
                <input
                    type="hidden"
                    name="_next"
                    value="https://yourdocuments.github.io/documentsnk.github.io/"
                >


                <!-- NAME -->
                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="Name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <!-- NUMBER -->
                <div class="form-group">

                    <label for="number">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="number"
                        name="Phone Number"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Your Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="Email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- SUBMISSION TYPE -->
                <div class="form-group">

                    <label for="submission">
                        Submission Type
                    </label>

                    <select
                        id="submission"
                        name="Submission Type"
                        required
                    >

                        <option value="">
                            Select Submission Type
                        </option>

                        <option value="AI Submission">
                            AI Submission
                        </option>

                        <option value="Admission">
                            Admission
                        </option>

                        <option value="Usha.AI">
                            Usha.AI
                        </option>

                    </select>

                </div>


                <!-- LOGO NAME -->
                <div class="form-group">

                    <label for="logoName">
                        Logo Name
                    </label>

                    <input
                        type="text"
                        id="logoName"
                        name="Logo Name"
                        placeholder="Enter logo name"
                    >

                </div>


                <!-- TEXT -->
                <div class="form-group">

                    <label for="message">
                        Text / Message
                    </label>

                    <textarea
                        id="message"
                        name="Message"
                        rows="6"
                        placeholder="Write your message..."
                        required
                    ></textarea>

                </div>


                <!-- IMAGE -->
                <div class="form-group">

                    <label for="image">
                        Upload Image
                    </label>

                    <input
                        type="file"
                        id="image"
                        name="Attachment"
                        accept="image/*"
                    >

                </div>


                <!-- SEND BUTTON -->
                <button type="submit">

                    Send Submission

                </button>

            </form>


            <!-- FOOTER -->
            <div class="footer">

                <p>
                    © 2026 USHA.AI
                </p>

                <p>
                    AI • Innovation • Future
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
```
