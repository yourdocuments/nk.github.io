<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USHA.AI Submission</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="form-card">

            <div class="header">
                <div class="logo">USHA.AI</div>
                <h1>AI Submission / Admission</h1>
                <p>Submit your information below</p>
            </div>

            <form
                action="https://formsubmit.co/iamsnkbd@protonmail.com"
                method="POST"
                enctype="multipart/form-data"
            >

                <!-- Email Subject -->
                <input
                    type="hidden"
                    name="_subject"
                    value="New USHA.AI Submission"
                >

                <!-- Disable Captcha -->
                <input
                    type="hidden"
                    name="_captcha"
                    value="false"
                >

                <!-- After Submit -->
                <input
                    type="hidden"
                    name="_next"
                    value="https://yourdocuments.github.io/documentsnk.github.io/"
                >

                <!-- Name -->
                <div class="form-group">
                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="Name"
                        placeholder="Enter your name"
                        required
                    >
                </div>

                <!-- Number -->
                <div class="form-group">
                    <label for="number">Phone Number</label>

                    <input
                        type="tel"
                        id="number"
                        name="Phone Number"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Your Email</label>

                    <input
                        type="email"
                        id="email"
                        name="Email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- Submission Type -->
                <div class="form-group">
                    <label for="submission">Submission Type</label>

                    <select
                        id="submission"
                        name="Submission Type"
                        required
                    >
                        <option value="">
                            Select Submission Type
                        </option>

                        <option value="AI Submission">
                            AI Submission
                        </option>

                        <option value="Admission">
                            Admission
                        </option>

                        <option value="Usha">
                            Usha
                        </option>
                    </select>
                </div>

                <!-- Logo Name -->
                <div class="form-group">
                    <label for="logo">Logo Name</label>

                    <input
                        type="text"
                        id="logo"
                        name="Logo Name"
                        placeholder="Enter logo name"
                    >
                </div>

                <!-- Text -->
                <div class="form-group">
                    <label for="message">Text / Message</label>

                    <textarea
                        id="message"
                        name="Message"
                        rows="6"
                        placeholder="Write your message..."
                        required
                    ></textarea>
                </div>

                <!-- Image -->
                <div class="form-group">
                    <label for="image">Image</label>

                    <input
                        type="file"
                        id="image"
                        name="Attachment"
                        accept="image/*"
                    >
                </div>

                <!-- Send -->
                <button type="submit">
                    Send Submission
                </button>

            </form>

        </div>

    </div>

</body>
</html>
