<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#020605"
    >

    <title>USHA.AI — Secure Access</title>


    <style>

        /* =================================================
           RESET
           ================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 25px;

            overflow: hidden;

            background:
                radial-gradient(
                    circle at 50% 50%,
                    rgba(0,255,157,0.055),
                    transparent 32%
                ),
                #020605;

            color: #d7fff0;

            font-family:
                "Courier New",
                Consolas,
                monospace;
        }


        /* =================================================
           MATRIX / GRID BACKGROUND
           ================================================= */

        .grid {

            position: fixed;

            inset: 0;

            z-index: -10;

            opacity: 0.22;

            background-image:

                linear-gradient(
                    rgba(0,255,157,0.075) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(0,255,157,0.075) 1px,
                    transparent 1px
                );

            background-size:
                42px 42px;

            mask-image:
                radial-gradient(
                    circle,
                    black 0%,
                    transparent 78%
                );

            animation:
                gridMove 15s linear infinite;
        }


        @keyframes gridMove {

            from {
                background-position:
                    0 0;
            }

            to {
                background-position:
                    42px 42px;
            }

        }


        /* =================================================
           SCANLINES
           ================================================= */

        .scanlines {

            position: fixed;

            inset: 0;

            z-index: 10;

            pointer-events: none;

            background:
                repeating-linear-gradient(
                    to bottom,
                    rgba(0,255,157,0.025) 0px,
                    rgba(0,255,157,0.025) 1px,
                    transparent 1px,
                    transparent 5px
                );

            opacity: 0.45;
        }


        /* =================================================
           FLOATING GLOW
           ================================================= */

        .glow {

            position: fixed;

            width: 360px;
            height: 360px;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(110px);

            z-index: -8;
        }


        .glow.one {

            top: -180px;
            left: -130px;

            background:
                rgba(0,255,157,0.10);

            animation:
                floatOne 8s ease-in-out infinite;
        }


        .glow.two {

            right: -180px;
            bottom: -180px;

            background:
                rgba(0,180,255,0.065);

            animation:
                floatTwo 11s ease-in-out infinite;
        }


        @keyframes floatOne {

            0%,
            100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(80px,50px);
            }

        }


        @keyframes floatTwo {

            0%,
            100% {
                transform:
                    translate(0,0);
            }

            50% {
                transform:
                    translate(-70px,-45px);
            }

        }


        /* =================================================
           TOP SYSTEM STATUS
           ================================================= */

        .system-status {

            position: fixed;

            top: 18px;
            left: 20px;

            display: flex;

            align-items: center;

            gap: 8px;

            color: #4e806c;

            font-size: 8px;

            letter-spacing: 1px;

            z-index: 20;
        }


        .status-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background:
                #00ff9d;

            box-shadow:
                0 0 9px
                #00ff9d;

            animation:
                pulse 1.5s infinite;
        }


        @keyframes pulse {

            50% {
                opacity: 0.25;
            }

        }


        /* =================================================
           LOGIN WRAPPER
           ================================================= */

        .login-wrapper {

            width: 100%;

            max-width: 440px;

            position: relative;

            z-index: 5;

            animation:
                appear 0.7s ease forwards;
        }


        @keyframes appear {

            from {

                opacity: 0;

                transform:
                    translateY(18px)
                    scale(0.98);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =================================================
           LOGO
           ================================================= */

        .logo {

            text-align: center;

            margin-bottom: 25px;
        }


        .logo h1 {

            color: #ffffff;

            font-size:
                clamp(35px, 9vw, 52px);

            line-height: 1;

            letter-spacing: 4px;

            font-weight: 900;

            text-shadow:
                0 0 25px
                rgba(255,255,255,0.07);
        }


        .logo h1 span {

            color: #00ff9d;

            text-shadow:
                0 0 18px
                rgba(0,255,157,0.5);
        }


        .logo p {

            margin-top: 10px;

            color: #477561;

            font-size: 8px;

            letter-spacing: 2.5px;
        }


        /* =================================================
           LOGIN CARD
           ================================================= */

        .login-card {

            position: relative;

            padding: 35px;

            border:
                1px solid
                rgba(0,255,157,0.20);

            border-radius: 16px;

            background:
                rgba(2,12,9,0.90);

            backdrop-filter:
                blur(18px);

            box-shadow:

                0 0 0 1px
                rgba(0,255,157,0.025),

                0 25px 80px
                rgba(0,0,0,0.55),

                0 0 45px
                rgba(0,255,157,0.035);

            overflow: hidden;
        }


        /* TOP LIGHT */

        .login-card::before {

            content: "";

            position: absolute;

            top: 0;
            left: 8%;

            width: 84%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    #00ff9d,
                    transparent
                );

            box-shadow:
                0 0 14px
                #00ff9d;

            opacity: 0.75;
        }


        /* CORNER */

        .login-card::after {

            content: "";

            position: absolute;

            right: 14px;
            bottom: 14px;

            width: 25px;
            height: 25px;

            border-right:
                1px solid
                rgba(0,255,157,0.35);

            border-bottom:
                1px solid
                rgba(0,255,157,0.35);
        }


        /* =================================================
           TERMINAL HEADER
           ================================================= */

        .terminal-header {

            display: flex;

            align-items: center;

            gap: 7px;

            margin-bottom: 28px;

            color: #527d6b;

            font-size: 8px;

            letter-spacing: 1px;
        }


        .terminal-header .terminal-dot {

            width: 6px;
            height: 6px;

            border-radius: 50%;

            background: #00ff9d;
        }


        .terminal-header span:last-child {

            margin-left: auto;

            color: #315645;
        }


        /* =================================================
           TITLE
           ================================================= */

        .login-title {

            margin-bottom: 25px;
        }


        .login-title .code {

            color: #00ff9d;

            font-size: 8px;

            letter-spacing: 1.5px;

            margin-bottom: 8px;
        }


        .login-title h2 {

            color: #ffffff;

            font-size: 22px;

            letter-spacing: 0.5px;
        }


        .login-title p {

            margin-top: 7px;

            color: #557969;

            font-family:
                Arial,
                sans-serif;

            font-size: 12px;
        }


        /* =================================================
           FORM
           ================================================= */

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 8px;

            color: #75a48f;

            font-size: 8px;

            letter-spacing: 1.2px;
        }


        .input-wrap {

            position: relative;
        }


        .input-prefix {

            position: absolute;

            left: 13px;
            top: 50%;

            transform:
                translateY(-50%);

            color: #00a96b;

            font-size: 10px;

            pointer-events: none;
        }


        .form-group input {

            width: 100%;

            height: 50px;

            padding:
                0 14px 0 32px;

            outline: none;

            border:
                1px solid
                #123b2c;

            border-radius: 8px;

            background:
                rgba(0,5,3,0.90);

            color: #c9ffec;

            font-family: inherit;

            font-size: 12px;

            transition:
                0.25s ease;
        }


        .form-group input::placeholder {

            color: #315847;
        }


        .form-group input:focus {

            border-color:
                rgba(0,255,157,0.70);

            box-shadow:
                0 0 20px
                rgba(0,255,157,0.07),

                inset 0 0 10px
                rgba(0,255,157,0.025);
        }


        /* =================================================
           PASSWORD TOGGLE
           ================================================= */

        .password-toggle {

            position: absolute;

            right: 10px;
            top: 50%;

            transform:
                translateY(-50%);

            border: 0;

            background: transparent;

            color: #416e5b;

            font-family: inherit;

            font-size: 8px;

            cursor: pointer;

            padding: 7px;

            transition:
                0.2s ease;
        }


        .password-toggle:hover {

            color: #00ff9d;
        }


        #password {

            padding-right: 65px;
        }


        /* =================================================
           LOGIN BUTTON
           ================================================= */

        .login-button {

            position: relative;

            width: 100%;

            height: 51px;

            margin-top: 5px;

            border:
                1px solid
                #00ff9d;

            border-radius: 8px;

            background:
                rgba(0,255,157,0.07);

            color: #00ff9d;

            font-family: inherit;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 1.2px;

            cursor: pointer;

            overflow: hidden;

            transition:
                0.25s ease;
        }


        .login-button::before {

            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.10),
                    transparent
                );

            transition:
                0.5s ease;
        }


        .login-button:hover::before {

            left: 130%;
        }


        .login-button:hover {

            background:
                #00ff9d;

            color: #00150d;

            box-shadow:
                0 0 30px
                rgba(0,255,157,0.22);
        }


        .login-button:disabled {

            cursor: wait;

            opacity: 0.65;

            background:
                rgba(0,255,157,0.06);

            color: #00ff9d;
        }


        /* =================================================
           STATUS
           ================================================= */

        #loginStatus {

            min-height: 19px;

            margin-top: 14px;

            text-align: center;

            font-size: 9px;

            line-height: 1.5;
        }


        #loginStatus.error {

            color: #ff5577;

            text-shadow:
                0 0 10px
                rgba(255,85,119,0.25);
        }


        #loginStatus.success {

            color: #00ff9d;

            text-shadow:
                0 0 10px
                rgba(0,255,157,0.25);
        }


        /* =================================================
           FOOTER
           ================================================= */

        .security-note {

            margin-top: 22px;

            padding-top: 17px;

            border-top:
                1px solid
                rgba(0,255,157,0.08);

            text-align: center;

            color: #315645;

            font-size: 7px;

            line-height: 1.8;

            letter-spacing: 0.6px;
        }


        .security-note span {

            color: #477c66;
        }


        /* =================================================
           ACCESS GRANTED OVERLAY
           ================================================= */

        .access-overlay {

            position: fixed;

            inset: 0;

            z-index: 100;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #020605;

            opacity: 0;

            visibility: hidden;

            transition:
                0.35s ease;
        }


        .access-overlay.show {

            opacity: 1;

            visibility: visible;
        }


        .access-box {

            text-align: center;

            transform:
                scale(0.85);

            transition:
                0.45s ease;
        }


        .access-overlay.show
        .access-box {

            transform:
                scale(1);
        }


        .access-symbol {

            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid
                #00ff9d;

            border-radius: 50%;

            color: #00ff9d;

            font-size: 25px;

            box-shadow:
                0 0 35px
                rgba(0,255,157,0.18);

            animation:
                accessPulse 1s infinite;
        }


        @keyframes accessPulse {

            50% {

                box-shadow:
                    0 0 60px
                    rgba(0,255,157,0.35);
            }

        }


        .access-box h2 {

            color: #00ff9d;

            font-size: 19px;

            letter-spacing: 2px;
        }


        .access-box p {

            margin-top: 9px;

            color: #527d6a;

            font-size: 8px;

            letter-spacing: 1px;
        }


        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 520px) {

            body {

                padding: 15px;
            }


            .system-status {

                top: 12px;
                left: 12px;

                font-size: 7px;
            }


            .login-card {

                padding: 27px 21px;

                border-radius: 13px;
            }


            .logo {

                margin-bottom: 20px;
            }


            .logo h1 {

                font-size: 37px;

                letter-spacing: 3px;
            }


            .login-title h2 {

                font-size: 20px;
            }

        }


    </style>

</head>


<body>


    <!-- =================================================
         BACKGROUND
         ================================================= -->

    <div class="grid"></div>

    <div class="glow one"></div>

    <div class="glow two"></div>

    <div class="scanlines"></div>


    <!-- =================================================
         SYSTEM STATUS
         ================================================= -->

    <div class="system-status">

        <span class="status-dot"></span>

        SECURE SYSTEM ONLINE

    </div>


    <!-- =================================================
         LOGIN
         ================================================= -->

    <main class="login-wrapper">


        <!-- LOGO -->

        <div class="logo">

            <h1>
                USHA<span>.AI</span>
            </h1>

            <p>
                INTELLIGENCE PLATFORM
            </p>

        </div>


        <!-- CARD -->

        <section class="login-card">


            <!-- TERMINAL HEADER -->

            <div class="terminal-header">

                <span class="terminal-dot"></span>

                AUTHENTICATION TERMINAL

                <span>
                    v1.0
                </span>

            </div>


            <!-- TITLE -->

            <div class="login-title">

                <div class="code">
                    // SECURE ACCESS REQUIRED
                </div>

                <h2>
                    Welcome back.
                </h2>

                <p>
                    Enter your credentials to continue.
                </p>

            </div>


            <!-- FORM -->

            <form id="loginForm">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        EMAIL ADDRESS
                    </label>


                    <div class="input-wrap">

                        <span class="input-prefix">
                            @
                        </span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="user@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        ACCESS KEY
                    </label>


                    <div class="input-wrap">

                        <span class="input-prefix">
                            #
                        </span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter access key"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                        >
                            SHOW
                        </button>

                    </div>

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                    id="loginButton"
                >
                    [ INITIALIZE ACCESS ]
                </button>


                <!-- STATUS -->

                <div
                    id="loginStatus"
                    aria-live="polite"
                ></div>


            </form>


            <!-- SECURITY NOTE -->

            <div class="security-note">

                CONNECTION STATUS:
                <span>ENCRYPTED</span>
                <br>

                AUTHORIZATION:
                <span>REQUIRED</span>

            </div>


        </section>


    </main>


    <!-- =================================================
         ACCESS OVERLAY
         ================================================= -->

    <div
        class="access-overlay"
        id="accessOverlay"
    >

        <div class="access-box">

            <div class="access-symbol">
                ✓
            </div>

            <h2>
                ACCESS GRANTED
            </h2>

            <p>
                INITIALIZING USHA.AI...
            </p>

        </div>

    </div>


    <!-- =================================================
         AUTH SYSTEM
         ================================================= -->

    <script src="auth.js"></script>


    <!-- =================================================
         LOGIN UI
         ================================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const form =
                    document.getElementById(
                        "loginForm"
                    );


                const email =
                    document.getElementById(
                        "email"
                    );


                const password =
                    document.getElementById(
                        "password"
                    );


                const toggle =
                    document.getElementById(
                        "passwordToggle"
                    );


                const button =
                    document.getElementById(
                        "loginButton"
                    );


                const status =
                    document.getElementById(
                        "loginStatus"
                    );


                const overlay =
                    document.getElementById(
                        "accessOverlay"
                    );


                /* =========================================
                   PASSWORD SHOW / HIDE
                   ========================================= */

                toggle.addEventListener(
                    "click",
                    function () {

                        if (
                            password.type ===
                            "password"
                        ) {

                            password.type =
                                "text";

                            toggle.textContent =
                                "HIDE";

                        }
                        else {

                            password.type =
                                "password";

                            toggle.textContent =
                                "SHOW";

                        }

                    }
                );


                /* =========================================
                   LOGIN
                   ========================================= */

                form.addEventListener(
                    "submit",
                    function (event) {

                        event.preventDefault();


                        const userEmail =
                            email.value.trim();


                        const userPassword =
                            password.value;


                        /* EMAIL */

                        if (!userEmail) {

                            status.textContent =
                                "ACCESS DENIED — Email required.";

                            status.className =
                                "error";

                            email.focus();

                            return;

                        }


                        const emailPattern =
                            /^[^\s@]+@[^\s@]+\.[^\s@]+$/;


                        if (
                            !emailPattern.test(
                                userEmail
                            )
                        ) {

                            status.textContent =
                                "ACCESS DENIED — Invalid email.";

                            status.className =
                                "error";

                            email.focus();

                            return;

                        }


                        /* PASSWORD */

                        if (!userPassword) {

                            status.textContent =
                                "ACCESS DENIED — Access key required.";

                            status.className =
                                "error";

                            password.focus();

                            return;

                        }


                        /*
                         * The actual credential check
                         * remains inside auth.js.
                         */

                        button.disabled =
                            true;

                        button.textContent =
                            "[ VERIFYING... ]";


                        status.textContent =
                            "VERIFYING CREDENTIALS...";

                        status.className =
                            "";


                        /*
                         * Call the existing login
                         * validation from auth.js.
                         *
                         * Demo password:
                         * iloveyouneil
                         */

                        setTimeout(
                            function () {

                                if (
                                    userPassword !==
                                    "iloveyouneil"
                                ) {

                                    button.disabled =
                                        false;

                                    button.textContent =
                                        "[ INITIALIZE ACCESS ]";


                                    status.textContent =
                                        "ACCESS DENIED — Invalid access key.";

                                    status.className =
                                        "error";


                                    password.value =
                                        "";

                                    password.focus();

                                    return;

                                }


                                /*
                                 * Save session.
                                 */

                                localStorage.setItem(
                                    "usha_ai_logged_in",
                                    "true"
                                );


                                localStorage.setItem(
                                    "usha_ai_user_email",
                                    userEmail
                                );


                                /*
                                 * SUCCESS
                                 */

                                button.textContent =
                                    "[ ACCESS GRANTED ]";


                                status.textContent =
                                    "AUTHENTICATION SUCCESSFUL";

                                status.className =
                                    "success";


                                overlay.classList.add(
                                    "show"
                                );


                                /*
                                 * Redirect
                                 */

                                setTimeout(
                                    function () {

                                        window.location.href =
                                            "index.html";

                                    },
                                    1100
                                );


                            },
                            550
                        );

                    }
                );


                /* =========================================
                   ENTER KEY FEEDBACK
                   ========================================= */

                [email, password].forEach(
                    function (input) {

                        input.addEventListener(
                            "input",
                            function () {

                                if (
                                    status.className ===
                                    "error"
                                ) {

                                    status.textContent =
                                        "";

                                    status.className =
                                        "";

                                }

                            }
                        );

                    }
                );


            }
        );

    </script>


</body>

</html>
