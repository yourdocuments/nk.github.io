<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login | USHA.AI</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body class="login-page">

```
<div class="login-card">


    <!-- USHA.AI LOGO -->

    <div class="login-logo">
        USHA<span>.AI</span>
    </div>


    <div class="login-line"></div>


    <h1>
        Welcome Back
    </h1>


    <p class="login-subtitle">
        Login to continue to USHA.AI
    </p>



    <!-- LOGIN FORM -->

    <form id="loginForm">


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>


            <input
                type="text"
                id="username"
                placeholder="Enter username"
                autocomplete="username"
                required
            >

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>


            <input
                type="password"
                id="password"
                placeholder="Enter password"
                autocomplete="current-password"
                required
            >

        </div>



        <!-- LOGIN BUTTON -->

        <button
            type="submit"
            id="loginButton"
        >
            Login
        </button>


        <!-- LOGIN MESSAGE -->

        <div id="loginStatus"></div>


    </form>



    <!-- FOOTER -->

    <div class="login-footer">

        © 2026 USHA.AI

    </div>


</div>



<script src="script.js"></script>
```

</body>

</html>
