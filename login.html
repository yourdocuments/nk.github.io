<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>USHA.AI — Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #020509;
            color: #00ff9d;

            font-family: "Courier New", monospace;
        }

        /* Hacker background */

        .matrix {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -2;
        }

        .matrix span {
            position: absolute;
            top: -100px;

            color: rgba(0, 255, 157, 0.35);

            font-size: 14px;
            writing-mode: vertical-rl;

            animation: fall linear infinite;
        }

        .matrix span:nth-child(1) {
            left: 5%;
            animation-duration: 7s;
        }

        .matrix span:nth-child(2) {
            left: 15%;
            animation-duration: 5s;
        }

        .matrix span:nth-child(3) {
            left: 28%;
            animation-duration: 8s;
        }

        .matrix span:nth-child(4) {
            left: 42%;
            animation-duration: 6s;
        }

        .matrix span:nth-child(5) {
            left: 58%;
            animation-duration: 9s;
        }

        .matrix span:nth-child(6) {
            left: 73%;
            animation-duration: 5.5s;
        }

        .matrix span:nth-child(7) {
            left: 88%;
            animation-duration: 7.5s;
        }

        @keyframes fall {
            from {
                transform: translateY(-120%);
            }

            to {
                transform: translateY(120vh);
            }
        }

        /* Scan line */

        .scanline {
            position: fixed;
            left: 0;
            right: 0;
            top: -5px;

            height: 2px;

            background: #00ff9d;

            box-shadow:
                0 0 10px #00ff9d,
                0 0 30px #00ff9d;

            opacity: 0.5;

            animation: scan 4s linear infinite;
        }

        @keyframes scan {
            to {
                top: 105%;
            }
        }

        /* Login box */

        .login-box {
            width: min(410px, calc(100% - 35px));

            padding: 35px;

            background:
                rgba(2, 12, 9, 0.94);

            border:
                1px solid rgba(0, 255, 157, 0.35);

            border-radius: 18px;

            box-shadow:
                0 0 50px rgba(0, 255, 157, 0.08),
                inset 0 0 35px rgba(0, 255, 157, 0.025);

            backdrop-filter: blur(12px);
        }

        .logo {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo h1 {
            margin: 0;

            color: #fff;

            font-size: 34px;

            letter-spacing: 3px;
        }

        .logo h1 span {
            color: #00ff9d;

            text-shadow:
                0 0 15px #00ff9d;
        }

        .logo p {
            margin: 8px 0 0;

            color: #467d67;

            font-size: 10px;

            letter-spacing: 2px;
        }

        /* Terminal */

        .terminal {
            min-height: 90px;

            margin-bottom: 25px;
            padding: 13px;

            background: #010605;

            border:
                1px solid #0b3023;

            border-radius: 8px;

            color: #00ff9d;

            font-size: 11px;

            line-height: 1.7;

            overflow: hidden;
        }

        .cursor {
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* Inputs */

        .group {
            margin-bottom: 18px;
        }

        .group label {
            display: block;

            margin-bottom: 7px;

            color: #6ba88e;

            font-size: 11px;
        }

        .group input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border:
                1px solid #143d2e;

            border-radius: 9px;

            outline: none;

            background: #010605;

            color: #00ff9d;

            font-family: inherit;
            font-size: 14px;

            transition: 0.25s;
        }

        .group input:focus {
            border-color: #00ff9d;

            box-shadow:
                0 0 18px rgba(0, 255, 157, 0.12);
        }

        .group input::placeholder {
            color: #315847;
        }

        /* Button */

        #loginButton {
            width: 100%;
            height: 50px;

            margin-top: 5px;

            border: 0;
            border-radius: 9px;

            background: #00ff9d;

            color: #00140d;

            font-family: inherit;

            font-size: 13px;
            font-weight: 900;

            cursor: pointer;

            transition: 0.25s;
        }

        #loginButton:hover {
            background: #65ffc1;

            box-shadow:
                0 0 30px rgba(0, 255, 157, 0.3);

            transform: translateY(-2px);
        }

        #loginStatus {
            min-height: 22px;

            margin-top: 15px;

            text-align: center;

            font-size: 11px;
        }

        .error {
            color: #ff5577;
        }

        .success {
            color: #00ff9d;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 25px 20px;
            }

            .logo h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Hacker animation -->

    <div class="matrix">
        <span>01010111010101010101010111001010</span>
        <span>ACCESS SYSTEM USHA AI 01010101</span>
        <span>101010101010011001010101010101</span>
        <span>SECURE TERMINAL 110010101010</span>
        <span>010101010101010101110101010101</span>
        <span>USHA.AI AUTH NODE 0101010101</span>
        <span>101010101010101001010101010101</span>
    </div>

    <div class="scanline"></div>

    <!-- Login -->

    <main class="login-box">

        <div class="logo">
            <h1>USHA<span>.AI</span></h1>
            <p>SECURE ACCESS TERMINAL</p>
        </div>

        <div class="terminal" id="terminal"></div>

        <form id="loginForm">

            <div class="group">
                <label>EMAIL</label>

                <input
                    type="email"
                    id="email"
                    placeholder="user@example.com"
                    required
                >
            </div>

            <div class="group">
                <label>PASSWORD</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button id="loginButton" type="submit">
                [ ACCESS SYSTEM ]
            </button>

            <div id="loginStatus"></div>

        </form>

    </main>

    <script src="auth.js"></script>

</body>
</html>
